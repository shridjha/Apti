<meta name="description" content="Apti is a free, no-login web app to practice aptitude questions and puzzles. Train your brain and prepare for campus placements and job interviews. No signup, data saved locally in your browser." />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",

  "url": "https://apti.live",
  "description": "Free no-login web app for practicing aptitude questions and puzzles to prepare for placements and job interviews. All progress saved locally in browser.",
  "applicationCategory": "EducationalApplication",
  "operatingSystem": "Any",
  "browserRequirements": "Requires JavaScript",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "featureList": [
    "No login required",
    "Local data storage",
    "Aptitude question practice",
    "Puzzle training",
    "Placement preparation"
  ]
}
</script>
